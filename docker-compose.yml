services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: Batas_cms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin123
    volumes:
      - pgdata:/var/lib/postgresql/data


  cms:
    build:
      context: .
      dockerfile: Dockerfile.cms
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      - postgres

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8080:8080"
    depends_on:
      - cms

volumes:
  pgdata:

